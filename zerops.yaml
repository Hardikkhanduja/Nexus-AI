zerops:
  # 1. Managed PostgreSQL Database
  - setup: db
    type: postgresql@16

  # 2. FastAPI Python Backend Web Server (WebSockets Engine)
  - setup: api
    type: python@3.11
    build:
      base: python@3.11
      buildCommands:
        - pip install -r backend/requirements.txt
      deployFiles:
        - backend
    run:
      base: python@3.11
      start: python -m uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-80} --ws auto --proxy-headers --forwarded-allow-ips='*'
      envVariables:
        PORT: "80"
        PYTHONPATH: "."

  # 3. React Vite Static Frontend
  - setup: app
    type: static
    build:
      base: nodejs@20
      buildCommands:
        - cd artifacts/nexus-ai && npm install && npm run build
      deployFiles:
        - artifacts/nexus-ai/dist/public/~
