services:
  # 1. FastAPI Python Backend Web Server & WebSockets
  - type: web
    name: nexus-ai-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --ws auto
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: .

  # 2. React Vite Static Frontend
  - type: web
    name: nexus-ai-frontend
    env: static
    buildCommand: cd artifacts/nexus-ai && npm install && npm run build
    staticPublishPath: ./artifacts/nexus-ai/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
