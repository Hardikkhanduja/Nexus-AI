zerops:
  # 1. Managed PostgreSQL Database
  - setup: db
    type: postgresql@16

  # 2. FastAPI Python Backend Web Server (WebSockets Engine)
  - setup: api
    type: python@3.11
    build:
      base: python@3.11
      buildCommands:
        - python -m venv venv
        - ./venv/bin/pip install --upgrade pip
        - ./venv/bin/pip install -r backend/requirements.txt
      deployFiles:
        - backend
        - venv
    run:
      base: python@3.11
      start: ./venv/bin/uvicorn backend.main:app --host 0.0.0.0 --port 8000 --ws auto --proxy-headers --forwarded-allow-ips='*'
      envVariables:
        PORT: "8000"
        PYTHONPATH: "."

  # 3. React Vite Static Frontend
  - setup: app
    type: static
    build:
      base: nodejs@20
      buildCommands:
        - cd artifacts/nexus-ai && npm install && npm run build
      deployFiles:
        - artifacts/nexus-ai/dist/public/~
